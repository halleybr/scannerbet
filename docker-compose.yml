services:
  scannergreen:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scannergreen
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
