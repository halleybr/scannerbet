server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WebSocket proxy para o backend
    location /ws {
        proxy_pass http://scannergreen-backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://scannergreen-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache-busting: nunca cachear o HTML principal
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Gzip para melhor performance
    gzip on;
    gzip_types text/html text/plain application/javascript text/css;
    gzip_min_length 256;

    # Health check
    location /health {
        access_log off;
        proxy_pass http://scannergreen-backend:8000/health;
    }
}
